name: Repository Maintenance

on:
  schedule:
    - cron: '0 0 * * *' # 每天午夜运行
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ master ]
    paths:
      - 'categories/*.md'
      - 'README.md'
      - 'scripts/*.py'

# 同一时间只允许一个维护任务运行，避免两个运行竞争产生 rebase 冲突
concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Maintenance Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/maintain_repo.py

      - name: Commit and push changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # [skip ci] 防止本 workflow 被自己的提交再次触发
          git commit -m "chore: automated repository maintenance (stars, links, metadata) [skip ci]"

          # 带重试的推送：若上游有新提交导致 rebase 冲突，由于维护提交完全
          # 可由脚本重新生成，直接重置到上游后重新生成再试。
          for attempt in 1 2 3; do
            git fetch origin master
            if git rebase origin/master; then
              if git push origin HEAD:master; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
            else
              git rebase --abort
              git reset --hard origin/master
              python scripts/maintain_repo.py
              git add .
              if git diff --cached --quiet; then
                echo "Upstream already contains these maintenance changes"
                exit 0
              fi
              git commit -m "chore: automated repository maintenance (stars, links, metadata) [skip ci]"
            fi
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1
